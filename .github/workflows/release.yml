name: Build and release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      # A tagged release publishes both the stripped official binary and a
      # debug variant of that exact version, useful for field debugging.
      profiles: '["release","dev"]'
      create_release: true
      retention_days: 90
